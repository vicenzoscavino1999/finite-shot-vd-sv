    bad_denominator_prob_exact: {atol: 1.0e-12, rtol: 1.0e-9}
    bad_denominator_prob_empirical: {atol: 1.0e-9, rtol: 1.0e-6}
    clip_activation_rate: {atol: 1.0e-9, rtol: 1.0e-6}
    mse_clipped: {atol: 1.0e-9, rtol: 1.0e-6}
    mse_ordinary_finite: {atol: 1.0e-9, rtol: 1.0e-6}
    ordinary_nonfinite_rate: {atol: 1.0e-12, rtol: 0.0}
    p1_leading_mse: {atol: 1.0e-12, rtol: 1.0e-9}
    relative_deviation_clipped: {atol: 1.0e-9, rtol: 1.0e-6}
    relative_deviation_ordinary_finite: {atol: 1.0e-9, rtol: 1.0e-6}
    excess_kurtosis_clipped: {atol: 1.0e-8, rtol: 1.0e-6}
