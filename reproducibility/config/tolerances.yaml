# Level 1 numerical tolerances.  verify.py checks |gen - ref| <= atol + rtol*|ref|.
#
# Closed-form / deterministic white-box columns use machine-tight tolerances.
# Finite-shot columns are deterministic given the seed and the numpy bit-stream
# (PCG64 binomial/multinomial draws are platform-independent), so they are also
# tight here; Phase B recalibrates them from >=3 container runs and may relax
# them for cross-BLAS ULP drift (REPRODUCIBILITY_PLAN tolerance registration).

_defaults: {atol: 1.0e-10, rtol: 1.0e-8}

e1_quotient_decomposition.csv:
  columns:
    mse: {atol: 1.0e-9, rtol: 1.0e-6}
    mse_se: {atol: 1.0e-9, rtol: 1.0e-6}
    beta0: {atol: 1.0e-9, rtol: 1.0e-6}
    beta1: {atol: 1.0e-8, rtol: 1.0e-6}
    beta2: {atol: 1.0e-6, rtol: 1.0e-6}
    b2_closed_form: {atol: 1.0e-12, rtol: 0.0}
    vtilde_closed_form: {atol: 1.0e-12, rtol: 0.0}
    delta_aic: {atol: 1.0e-6, rtol: 1.0e-6}

e2_c_sv_zero.csv:
  columns:
    bias_minus_pop: {atol: 1.0e-9, rtol: 1.0e-6}
    c_slope_estimate: {atol: 1.0e-7, rtol: 1.0e-6}
    c_slope_ci_lower: {atol: 1.0e-7, rtol: 1.0e-6}
    c_slope_ci_upper: {atol: 1.0e-7, rtol: 1.0e-6}

e3_delta_vd_generator.csv:
  columns:
    b_vd_inf: {atol: 1.0e-12, rtol: 0.0}
    delta_vd_measured: {atol: 1.0e-10, rtol: 1.0e-9}
    delta_vd_closed_form: {atol: 1.0e-12, rtol: 0.0}

e4_delta_sv_firstorder.csv:
